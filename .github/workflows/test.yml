name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil fonts-wqy-microhei
      - run: node --test tests/*.test.mjs
      - run: /usr/bin/python3 tests/collector_test.py
      - run: /usr/bin/python3 tests/cleanup_test.py
      - run: /usr/bin/python3 -m py_compile collector/collector.py collector/cleanup.py scripts/install.py scripts/install-cleanup.py scripts/diagnose.py
